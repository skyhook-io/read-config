name: Read Skyhook Config
description: Read service build/deploy config from a Skyhook YAML file (path, dockerfile, build context, deployment repo) by service name
author: Skyhook
inputs:
  working_directory:
    description: Path to the repository root containing .skyhook/skyhook.yaml
    required: false
    default: .
  service_name:
    description: Name of the service to look up in the config (must be non-empty)
    required: true
  config_path:
    description: Path to the skyhook config file relative to working_directory
    required: false
    default: .skyhook/skyhook.yaml
  default_dockerfile_path:
    description: Fallback for the dockerfile_path output. Used when the YAML config is unreadable, the service is missing, or buildTool.docker.dockerfilePath is unset/empty. Empty by default — the caller decides whether to fall back ("Dockerfile", "<service-path>/Dockerfile", etc.).
    required: false
    default: ''
  default_build_context:
    description: Fallback for the build_context output. Used when the YAML config is unreadable, the service is missing, or buildTool.docker.buildContext is unset/empty. Empty by default — the caller decides (".", the source path, etc.).
    required: false
    default: ''
outputs:
  name:
    description: Service name from config
    value: ${{ steps.parse.outputs.name }}
  path:
    description: Service path relative to repo root
    value: ${{ steps.parse.outputs.path }}
  deployment_repo:
    description: Separate deployment repository (if configured)
    value: ${{ steps.parse.outputs.deployment_repo }}
  deployment_repo_path:
    description: Path within deployment repository
    value: ${{ steps.parse.outputs.deployment_repo_path }}
  build_context:
    description: Docker build context relative to repo root. Sourced from buildTool.docker.buildContext in the YAML when available; falls back to the default_build_context input otherwise.
    value: ${{ steps.parse.outputs.build_context }}
  dockerfile_path:
    description: Dockerfile path relative to repo root. Sourced from buildTool.docker.dockerfilePath in the YAML when available; falls back to the default_dockerfile_path input otherwise.
    value: ${{ steps.parse.outputs.dockerfile_path }}
  config_found:
    description: Whether the config file was found (true/false)
    value: ${{ steps.parse.outputs.config_found }}
  service_found:
    description: Whether the service was found in config (true/false)
    value: ${{ steps.parse.outputs.service_found }}
runs:
  using: composite
  steps:
  - name: Install locked yq
    shell: bash
    run: python3 "${{ github.action_path }}/.locked/install.py" yq
  - name: Parse skyhook config
    id: parse
    shell: bash
    env:
      WORKING_DIR: ${{ inputs.working_directory }}
      SERVICE_NAME: ${{ inputs.service_name }}
      CONFIG_PATH: ${{ inputs.config_path }}
      DEFAULT_DOCKERFILE_PATH: ${{ inputs.default_dockerfile_path }}
      DEFAULT_BUILD_CONTEXT: ${{ inputs.default_build_context }}
    run: bash "$GITHUB_ACTION_PATH/scripts/parse.sh"
branding:
  icon: file-text
  color: blue
